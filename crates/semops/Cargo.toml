[package]
name = "semops"
description = "The SemOps System command"
version.workspace = true
edition.workspace = true
# tarka-cli, for `semops map`, needs 1.95 (Polars), and the command links it.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "semops"
path = "src/main.rs"
# The library has the same name and the documentation worth keeping.
doc = false

[dependencies]
semops-checks.workspace = true
# The engines' commands, as libraries: `semops serve`, `query`, `validate`, `map` and the
# rest run the same code as holos-server, holos, shacl and tarka.
holos-cli.workspace = true
holos-server.workspace = true
shacl-cli.workspace = true
tarka-cli.workspace = true
# `src/alloc.rs` of holos-server, compiled in here, counts through holos_engine::memory.
holos-engine.workspace = true
mimalloc = { version = "0.1", default-features = false }
# Writing a repaired document out as Turtle.
oxrdfio.workspace = true
anyhow.workspace = true
clap.workspace = true
csv.workspace = true
serde_json = "1"
# Azure Storage URLs as inputs (src/remote.rs). The binary already links object_store,
# tokio and reqwest through Polars, so this adds the Azure client and little else.
object_store = { version = "0.13", default-features = false, features = ["azure"] }
tokio = { version = "1", features = ["rt"] }
futures = "0.3"
url = "2"
tempfile.workspace = true
