{{- if and .Values.backup.enabled .Values.backup.blob.url }}
# The backup job's identity for Blob Storage, through AKS workload identity. The managed
# identity named by the annotation needs a federated credential for this service account
# (system:serviceaccount:<namespace>:<release>-backup) and Storage Blob Data Contributor on
# the container.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "holos.fullname" . }}-backup
  labels:
    {{- include "holos.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    azure.workload.identity/client-id: {{ .Values.backup.blob.clientId | quote }}
automountServiceAccountToken: false
{{- end }}
