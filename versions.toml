# The one version-pin file (roadmap phase 1).
#
# The consumers (the browser editor, the VS Code extension, the Python suite and its evidence
# repository, the manual) still take the engines as separate packages, and every one has to
# take the same release, or a graph can pass in the editor and fail in CI. From 0.31.0 the
# engine packages are built from this workspace, at its version. This file says which releases belong
# together; `scripts/check_pins.py` reads each consumer's lockfile and reports any that
# disagree. Phase 1's gate is that it reports none.
#
# When a component releases, change its version here first, then bring the consumers up to it.

[platform]
# The workspace version (Cargo.toml). semops-system 0.29.0 was the first release published
# under it, to PyPI.
version = "0.31.1"
pypi = "semops-system"

[engines.holos]
version = "0.31.0"
source = "holos/"
pypi = ["holosdb"]
npm = ["holos-wasm", "holos-wasm-node"]

[engines.shacl]
version = "0.31.0"
source = "shacl/"
pypi = ["shacl"]
npm = ["shacl-wasm", "shacl-wasm-node"]

[engines.tarka]
version = "0.31.0"
source = "tarka/"
pypi = ["tarka-rdf"]

# Each consumer, by repository name under pwin/, and the lockfiles that say what it really
# installs. A range in package.json or pyproject.toml is what it would accept; the lockfile is
# what it runs, and that is what this checks.
[consumers.turtle-editor-viewer]
lockfiles = ["package-lock.json"]

[consumers.consolidated-ontology-quality-suite-webapp]
lockfiles = ["package-lock.json"]

[consumers.consolidated-ontology-quality-suite-python]
lockfiles = ["uv.lock"]

[consumers.consolidated-ontology-quality-suite-python-testing]
lockfiles = ["uv.lock"]
