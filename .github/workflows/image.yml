# The container image, built and smoke-tested when what goes into it changes. Publishing it is
# release.yml's job; this one only proves it builds and runs.
#
# The image is one binary, `semops`, with holos-server, holos, shacl and tarka as links to it
# (docs/decisions/0008). Its entry point is the holos-server link.
name: image

on:
  pull_request:
    paths:
      - "holos/deploy/Dockerfile"
      - "holos/deploy/smoke.sh"
      - ".dockerignore"
      - "crates/semops/**"
      - ".github/workflows/image.yml"
  push:
    branches: [main]
    paths:
      - "holos/deploy/Dockerfile"
      - "holos/deploy/smoke.sh"
      - ".dockerignore"
      - "crates/semops/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    # RocksDB and Polars compile from source in the build stage.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The hosted runner's preinstalled toolchains leave too little disk for the build
      # stage; these are the largest it never uses.
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: docker build -f holos/deploy/Dockerfile -t semops:ci .
      - name: The engines' names are the one binary
        run: |
          set -euo pipefail
          for name in semops holos-server holos shacl tarka; do
            docker run --rm --entrypoint "$name" semops:ci --version
          done
      - name: The server answers, and the image's smoke test passes
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 7878:7878 semops:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7878/health > /dev/null && break; sleep 2; done
          docker exec smoke holos-smoke
          docker logs smoke 2>&1 | head -20
      - name: The quality checks run in the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint semops -v "$PWD:/work:ro" -w /work semops:ci \
            check crates/semops-checks/tests/fixtures/ontology/domain.ttl --fail-on never | tail -1
