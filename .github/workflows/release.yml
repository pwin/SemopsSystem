# A SemOps System release: the `semops` binary and each engine's own commands for five
# platforms, the multi-arch container image on GitHub Container Registry, and the GitHub
# Release that carries the binaries.
#
#   Tag  v*                 build everything, publish the image, create the release
#   Run workflow (manual)   the same for a tag that exists: to retry without moving it, or
#                           to add archives to a release made before they existed
#
# Separate from workflow.yml and engines.yml, which publish to PyPI as a trusted publisher:
# this one writes to the repository (the release) and to the registry (the image), and
# neither needs the other's permissions.
#
# The binary is the one `semops`, which is also holos-server, holos, shacl and tarka when run
# under those names (docs/decisions/0008). The Unix archives carry those names as links. For
# anyone who wants a single engine, each engine's commands are built on their own as well,
# in an archive named after the engine: holos (holos and holos-server), shacl and tarka.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.30.0"
        required: true
      image:
        description: "Build and push the container image too"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  IMAGE: ghcr.io/${{ github.repository_owner }}/semops

jobs:
  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Five binaries, sharing their crates; each link is a thin-LTO pass of its own.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # RocksDB's bindings need libclang, which neither hosted runner puts where bindgen
      # looks. The fixes are HOLOS's (holos/.github/workflows/release.yml explains them).
      - name: macOS build environment
        if: runner.os == 'macOS'
        run: |
          lib="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$lib/libclang.dylib" || { echo "no libclang.dylib under $lib"; exit 1; }
          echo "LIBCLANG_PATH=$lib" >> "$GITHUB_ENV"
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=10.13" >> "$GITHUB_ENV"
          fi
      - name: Point bindgen at libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lib = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$lib\libclang.dll")) { throw "no libclang.dll under $lib" }
          "LIBCLANG_PATH=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build
        run: >
          cargo build --locked --profile release-abort --target ${{ matrix.target }}
          -p semops -p holos-cli -p holos-server -p shacl-cli -p tarka-cli
      - name: Check the binaries run
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release-abort"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          "$dir/semops$exe" --version
          "$dir/semops$exe" check --list | tail -1
          # The one binary under the engines' names, then the engines' own binaries.
          mkdir -p alias
          for name in holos-server holos shacl tarka; do
            cp "$dir/semops$exe" "alias/$name$exe"
            "alias/$name$exe" --version
            "$dir/$name$exe" --version
          done
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          target="${{ matrix.target }}"
          dir="target/$target/release-abort"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p dist
          # pack NAME DOCS-DIR BINARY... : an archive of the binaries, with the README and
          # licences from DOCS-DIR.
          pack() {
            local name="$1" docs="$2"; shift 2
            mkdir -p "dist/$name"
            cp "$docs/README.md" "$docs/LICENSE-APACHE" "$docs/LICENSE-MIT" "dist/$name/"
            for bin in "$@"; do cp "$dir/$bin$exe" "dist/$name/"; done
            if [ -z "$exe" ] && [ "$name" = "semops-$version-$target" ]; then
              for alias in holos-server holos shacl tarka; do ln -s semops "dist/$name/$alias"; done
            fi
            if [ -n "$exe" ]; then
              (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          }
          pack "semops-$version-$target" . semops
          pack "holos-$version-$target" holos holos holos-server
          pack "shacl-$version-$target" shacl shacl
          pack "tarka-$version-$target" tarka tarka
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # The image for each architecture, built on a runner of that architecture (compiling
  # RocksDB and Polars under emulation takes hours) and pushed by digest. The `image` job
  # joins them into one multi-arch tag.
  image-arch:
    name: image (${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.image
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test and push
        id: push
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          local="semops:${tag#v}-${{ matrix.arch }}"
          docker buildx build --load -f holos/deploy/Dockerfile -t "$local" .
          # The image's own smoke test, against the server it starts.
          docker run -d --name smoke -p 7878:7878 "$local"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7878/health > /dev/null && break; sleep 2; done
          docker exec smoke holos-smoke
          docker exec smoke semops check --list | tail -1
          docker rm -f smoke
          remote="${IMAGE}:${tag#v}-${{ matrix.arch }}"
          docker tag "$local" "$remote"
          docker push "$remote"

  image:
    name: image (multi-arch)
    needs: image-arch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          docker buildx imagetools create \
            -t "${IMAGE}:${version}" -t "${IMAGE}:latest" \
            "${IMAGE}:${version}-amd64" "${IMAGE}:${version}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${version}"

  # Creates the release, or adds to one that exists. An archive the release already has is
  # left alone, not replaced: a rebuild is not byte-for-byte the same, and a published
  # checksum must keep matching its download. SHA256SUMS keeps its lines and gains the new
  # archives'.
  publish:
    name: publish the release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Create the release, or add to it
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="The \`semops\` binary for Linux (x86_64, aarch64), macOS (Apple Silicon, Intel) and Windows (x64). It is also holos-server, holos, shacl and tarka when run under those names; the Unix archives include those names as links. Each engine's commands are also built on their own, in the holos-, shacl- and tarka- archives, for anyone who wants one engine. Verify a download against SHA256SUMS. The container image is ${IMAGE}:${version}."
          cd dist
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            sha256sum * > SHA256SUMS
            cat SHA256SUMS
            gh release create "$TAG" * --title "SemOps System $version" --notes "$notes"
            exit 0
          fi
          published=$(gh release view "$TAG" --json assets -q '.assets[].name')
          new=()
          for f in *; do
            if grep -qxF "$f" <<< "$published"; then echo "kept as published: $f"; else new+=("$f"); fi
          done
          if [ ${#new[@]} -eq 0 ]; then echo "nothing to add"; exit 0; fi
          if grep -qxF SHA256SUMS <<< "$published"; then
            gh release download "$TAG" -p SHA256SUMS -O SHA256SUMS
          else
            : > SHA256SUMS
          fi
          sha256sum "${new[@]}" >> SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" "${new[@]}" SHA256SUMS --clobber
          gh release edit "$TAG" --notes "$notes"
