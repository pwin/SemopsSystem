# SemOps System: one Cargo workspace for HOLOS, SHACL_Engine and tarka.
#
# Each engine keeps its own directory, imported with `git subtree` so its history is intact
# and `git subtree pull` can still bring in upstream commits while the old repositories are
# active. Paths inside each directory (conformance suites, fixtures, scripts) are unchanged.
# docs/decisions/0001-one-workspace.md records the layout and what changed to make it build.

[workspace]
resolver = "3"
members = [
    # --- HOLOS (pwin/triplestore)
    "holos/crates/holos-build",
    "holos/crates/holos-core",
    "holos/crates/holos-store",
    "holos/crates/holos-security",
    "holos/crates/holos-shacl",
    "holos/crates/holos-shacl-engine",
    "holos/crates/holos-holon",
    "holos/crates/holos-stats",
    "holos/crates/holos-engine",
    "holos/crates/holos-cli",
    "holos/crates/holos-server",
    "holos/crates/holos-conformance",
    "holos/crates/holos-python",
    "holos/crates/holos-wasm",
    "holos/crates/holos-bench",
    # --- SHACL_Engine (pwin/SHACL_Engine)
    "shacl/crates/shacl",
    "shacl/crates/shacl-cli",
    "shacl/crates/shacl-python",
    "shacl/crates/shacl-wasm",
    # --- tarka (pwin/tarka)
    "tarka/crates/tarka",
    "tarka/crates/tarka-bottr",
    "tarka/crates/tarka-cli",
    "tarka/crates/tarka-core",
    "tarka/crates/tarka-io",
    "tarka/crates/tarka-ottr",
    "tarka/crates/tarka-polars",
    "tarka/crates/tarka-python",
    "tarka/crates/tarka-shacl",
    "tarka/crates/tarka-tarql",
    # --- shared
    # Members, not only patches: that is what runs their own tests (82 in oxsdatatypes,
    # 32 in spareval), the only thing guarding the changes made to them. CI keeps clippy off
    # them; see vendor/*/PROVENANCE.md.
    "vendor/oxsdatatypes",
    "vendor/spareval",
]
# Everything but the three Python extension modules, which maturin builds one at a time.
# Built in the same cargo run as the commands, tarka-python turns on pyo3 in polars-error
# (through pyo3-polars) and links python3.dll into `tarka`, which then cannot start without
# Python; holos-python asks for pyo3's `extension-module`, which leaves test binaries
# unlinkable on Linux and macOS. So a plain `cargo build` or `cargo test` leaves them out,
# and `--workspace` brings them back.
default-members = [
    "holos/crates/holos-build",
    "holos/crates/holos-core",
    "holos/crates/holos-store",
    "holos/crates/holos-security",
    "holos/crates/holos-shacl",
    "holos/crates/holos-shacl-engine",
    "holos/crates/holos-holon",
    "holos/crates/holos-stats",
    "holos/crates/holos-engine",
    "holos/crates/holos-cli",
    "holos/crates/holos-server",
    "holos/crates/holos-conformance",
    "holos/crates/holos-wasm",
    "holos/crates/holos-bench",
    "shacl/crates/shacl",
    "shacl/crates/shacl-cli",
    "shacl/crates/shacl-wasm",
    "tarka/crates/tarka",
    "tarka/crates/tarka-bottr",
    "tarka/crates/tarka-cli",
    "tarka/crates/tarka-core",
    "tarka/crates/tarka-io",
    "tarka/crates/tarka-ottr",
    "tarka/crates/tarka-polars",
    "tarka/crates/tarka-shacl",
    "tarka/crates/tarka-tarql",
    "vendor/oxsdatatypes",
    "vendor/spareval",
]

[workspace.package]
# One version for every crate, wheel and package this workspace builds. 0.29.0 is the first
# number above every component it replaces (holosdb 0.27.0, shacl 0.3.9, tarka-rdf 0.3.1,
# ontology-quality-suite 0.28.0), so each old name can carry on as a shim without its
# version going backwards.
version = "0.29.0"
# The default for crates that inherit it. HOLOS's crates are edition 2021 and say so in
# their own manifests; SHACL_Engine's and tarka's are 2024 and inherit this.
edition = "2024"
# The highest of the three (HOLOS asked for 1.87, the others for 1.90).
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pwin/SemopsSystem"
authors = ["Peter Winstanley"]

[workspace.dependencies]
# --- L0: reused wholesale from the Oxigraph project (MIT OR Apache-2.0).
# See holos/DESIGN.md §4 — do not rewrite parsers, term models or result serialisers.
# RDF 1.2 / SPARQL 1.2 features are ON for every crate that inherits these: triple terms are
# a HOLOS v1 requirement (holos/DESIGN.md §5). The `shacl` crate does not inherit them, so
# that it can still be built for RDF 1.1 alone: see shacl/crates/shacl/Cargo.toml.
oxrdf = { version = "0.3", features = ["rdf-12", "oxsdatatypes", "rdfc-10"] }
oxrdfio = { version = "0.2", features = ["rdf-12"] }
oxsdatatypes = "0.2"
sparesults = { version = "0.3", features = ["sparql-12"] }
# `sep-0002` gives xsd:date, xsd:time and the three duration types values, so that they
# compare (`?d < "2024-11-04"^^xsd:date`), sort by value and take part in date and duration
# arithmetic, and adds ADJUST. Without it the evaluator treats them as opaque typed literals:
# `<` between two dates is an error, a FILTER using it drops every row, and only dateTime
# compares. SEP-0002 is the SPARQL 1.2 community proposal for exactly these operators,
# following XPath's; Oxigraph keeps it behind a feature. Oxigraph's further `calendar-ext`
# (an order on gYear and the other Gregorian types, which XPath defines equality for but no
# order) is deliberately not enabled. All three crates take the feature so the parser, the
# optimiser and the evaluator agree.
spargebra = { version = "0.4", features = ["sparql-12", "sep-0002"] }
spareval = { version = "0.2", features = ["sparql-12", "sep-0002"] }
# Only for `sparopt::algebra::Expression`, which is what `spareval`'s public expression
# evaluator takes. Same version `spareval` itself resolves, so the types match.
sparopt = { version = "0.3", features = ["sep-0002"] }
# GeoSPARQL function library, from the Oxigraph family. Same reuse argument as the
# rest of L0: 43 conformance-heavy geometry functions nobody should rewrite.
spargeo = "0.5"
# Gzipped N-Triples and N-Quads are how large RDF is distributed; reading them is not
# optional for real datasets. Already in the tree via geojson, so no new supply chain.
flate2 = "1"
# geof:buffer and geof:boundary are not in spargeo; holos-engine implements them, and
# needs the same geometry stack spargeo itself uses so literals round-trip identically.
geo = "0.31"
wkt = "0.14"
geojson = "0.24"

# --- internal: HOLOS
holos-build = { path = "holos/crates/holos-build", version = "0.29.0" }
holos-core = { path = "holos/crates/holos-core", version = "0.29.0" }
holos-store = { path = "holos/crates/holos-store", version = "0.29.0" }
holos-engine = { path = "holos/crates/holos-engine", version = "0.29.0" }
holos-security = { path = "holos/crates/holos-security", version = "0.29.0" }
holos-conformance = { path = "holos/crates/holos-conformance", version = "0.29.0" }
holos-shacl = { path = "holos/crates/holos-shacl", version = "0.29.0" }
holos-shacl-engine = { path = "holos/crates/holos-shacl-engine", version = "0.29.0" }
holos-holon = { path = "holos/crates/holos-holon", version = "0.29.0" }
holos-stats = { path = "holos/crates/holos-stats", version = "0.29.0" }

# --- internal: SHACL_Engine. tarka took it by git tag with `rdf-12` on and `parallel` off;
# the same choice, now by path. The crates.io crate called `shacl` is another project.
shacl = { path = "shacl/crates/shacl", version = "0.29.0", default-features = false, features = ["rdf-12"] }

# --- internal: tarka
tarka-core = { path = "tarka/crates/tarka-core", version = "0.29.0" }
tarka-io = { path = "tarka/crates/tarka-io", version = "0.29.0" }
tarka-tarql = { path = "tarka/crates/tarka-tarql", version = "0.29.0" }
tarka-ottr = { path = "tarka/crates/tarka-ottr", version = "0.29.0" }
tarka = { path = "tarka/crates/tarka", version = "0.29.0" }
tarka-polars = { path = "tarka/crates/tarka-polars", version = "0.29.0" }
tarka-shacl = { path = "tarka/crates/tarka-shacl", version = "0.29.0" }
tarka-bottr = { path = "tarka/crates/tarka-bottr", version = "0.29.0" }

# --- everything else
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1.4"
# Free space on a filesystem, which `std` does not expose and which the maintenance
# commands need: `compact` writes a second copy of the store and `backup` can, so both
# can fill a disk. A thin wrapper over statvfs and GetDiskFreeSpaceExW — `default-features`
# off drops its async integrations, which this project has no runtime for.
fs4 = { version = "1", default-features = false, features = ["sync"] }
hashbrown = "0.16"
# insertion-ordered sets: tarka writes the output window in the order its triples were made
indexmap = "2"
polars = { version = "0.55", default-features = false, features = ["fmt", "parquet", "ipc", "lazy", "dtype-full", "timezones"] }
proptest = "1"
rayon = "1.12"
regex = "1"
rustc-hash = "2"
# Already in the tree through `geo`; declared because `holos-engine` uses it directly for
# the spatial index, and a transitive dependency is not a contract.
rstar = "0.12"
# `bindgen-runtime` is in rocksdb's default features, and `default-features = false` drops
# it. Without it `clang-sys` *links* libclang at build time instead of loading it, so the
# build script needs the dylib on the loader path rather than at LIBCLANG_PATH — which is
# not something a CI runner provides, and produced "Library not loaded: @rpath/
# libclang.dylib" on macOS and a page of undefined `clang_*` symbols on Linux. With it,
# LIBCLANG_PATH is honoured and the build works wherever a libclang exists.
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "bindgen-runtime"] }
tempfile = "3"
thiserror = "2"
# HTTP for tarka's Graph Store Protocol client; rustls, so there is no system TLS library to find
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

# The two fixes to the Oxigraph crates, now one copy for every engine (HOLOS and
# SHACL_Engine each vendored one, and tarka re-applied HOLOS's by git tag):
#
# oxsdatatypes 0.2.4 with decimal multiplication and division that round to 18 fractional
# digits instead of failing. Upstream refuses any product it cannot hold exactly, so
# `1.3 * 31.583333333333333333` was an error and left its variable unbound. See
# vendor/oxsdatatypes/PROVENANCE.md.
#
# spareval 0.2.9 with `+` accepting a duration on either side of a date, time or dateTime,
# as XPath's operator mapping does. Upstream takes only the temporal value first, and
# sparopt reorders the operands of every `+` by hash, so `?dateTime + "P2Y"^^xsd:yearMonthDuration`
# came out unbound for some values. See vendor/spareval/PROVENANCE.md.
[patch.crates-io]
oxsdatatypes = { path = "vendor/oxsdatatypes" }
spareval = { path = "vendor/spareval" }

# Unwinding, not abort. The Python extension modules need it: PyO3 turns a panic into a
# Python exception by catching it, and `panic` cannot be set per package. SHACL_Engine and
# tarka already shipped this way. HOLOS shipped `panic = "abort"`; its server and CLI
# release builds keep that through the `release-abort` profile below.
[profile.release]
lto = "thin"
codegen-units = 1
# Symbol names stay, so a backtrace from a shipped binary still names functions; debug
# information goes, which is most of the size.
strip = "debuginfo"

# HOLOS's release settings for the native commands and the container image:
# `cargo build --profile release-abort -p holos-cli -p holos-server`.
[profile.release-abort]
inherits = "release"
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
