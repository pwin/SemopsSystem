[package]
name = "holos-shacl"
description = "HOLOS L4 — SHACL validation over the store's own indexes"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Passthrough so the engine's parallel Turtle parser can be measured fairly against
# the bridge, which is what examples/bridge_vs_load does.
parallel = ["shacl/parallel"]

[dependencies]
holos-core.workspace = true
holos-store.workspace = true
# The SHACL engine, the same crate published as `shacl`: SHACL-SPARQL, node expressions,
# rules and full passes. HOLOS carried its own adapted copy until 0.31 (ADR 0011).
shacl.workspace = true
oxrdf.workspace = true
oxsdatatypes.workspace = true
regex = "1"
rustc-hash.workspace = true
thiserror.workspace = true

[dev-dependencies]
oxrdfio.workspace = true
# The function table every evaluator is tested against (tests/sparql_native.rs).
semops-functions.workspace = true
