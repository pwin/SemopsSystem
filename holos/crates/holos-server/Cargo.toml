[package]
name = "holos-server"
description = "HOLOS L6 — SPARQL 1.2 Protocol over HTTP, with a YASGUI console"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "holos-server"
path = "src/main.rs"

[dependencies]
holos-build.workspace = true
holos-core.workspace = true
holos-store.workspace = true
holos-security.workspace = true
holos-engine.workspace = true
holos-shacl.workspace = true
holos-stats.workspace = true
semops-placetime.workspace = true
oxrdf.workspace = true
oxrdfio.workspace = true
sparesults.workspace = true
spargebra.workspace = true
# X-MS-CLIENT-PRINCIPAL, Azure built-in authentication's identity document. Already in the
# tree (geojson), so no new supply chain.
serde_json = "1"
spareval.workspace = true
anyhow.workspace = true
fs4.workspace = true
# A small synchronous server. The store is single-writer/many-readers and its writes take
# `&mut`, so a thread-per-request model over an `RwLock` matches it exactly; an async
# runtime would buy nothing here but a much larger dependency tree.
tiny_http = "0.12"
# Protobuf over HTTP with a blocking client: the exporters run on their own threads, so the
# server stays free of an async runtime.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"], optional = true }

[features]
default = ["rocksdb", "otel"]
rocksdb = ["holos-store/rocksdb"]
# OpenTelemetry over OTLP/HTTP (src/telemetry.rs): off at run time unless an endpoint is set.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[build-dependencies]
holos-build.workspace = true
