[package]
name = "tarka-polars"
description = "Polars data frames, Parquet and Arrow IPC files as tarka input"
version.workspace = true
edition.workspace = true
# polars 0.55 needs sysinfo 0.39, and every sysinfo 0.39 release needs Rust 1.95. The rest
# of the workspace builds on 1.90 (ci.yml, msrv).
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
holos-engine.workspace = true
polars = { workspace = true }
rayon.workspace = true
thiserror.workspace = true
tarka.workspace = true
tarka-core.workspace = true
tarka-io.workspace = true

[dev-dependencies]
chrono = "0.4"
