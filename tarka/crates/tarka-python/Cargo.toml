[package]
name = "tarka-python"
description = "Python bindings for tarka: triplify Polars data frames with TARQL queries or OTTR templates"
version.workspace = true
edition.workspace = true
# polars 0.55 needs sysinfo 0.39, and every sysinfo 0.39 release needs Rust 1.95. The rest
# of the workspace builds on 1.90 (ci.yml, msrv).
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "tarka_py"
# rlib as well, so that the semops-system wheel can link it.
crate-type = ["cdylib", "rlib"]
# documented for Python, as the `tarka` module; tested with pytest
doc = false
test = false
doctest = false

[dependencies]
# The workspace patches these two crates from vendor/ ([patch] in the root Cargo.toml), and
# maturin copies a crate's path dependencies into its sdist but not [patch] paths. Naming
# them as path dependencies is what puts them in this package's sdist.
oxsdatatypes = { path = "../../../vendor/oxsdatatypes", version = "0.2" }
spareval = { path = "../../../vendor/spareval", version = "0.2" }
holos-engine.workspace = true
# abi3: one wheel per platform serves every CPython from 3.10 on
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-polars = "0.28"
tarka.workspace = true
tarka-bottr.workspace = true
tarka-polars.workspace = true
tarka-shacl.workspace = true
