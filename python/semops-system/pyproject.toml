[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "semops-system"
# The native wheel (roadmap phase 3), built from the workspace: the three engines and the
# ontology quality checks in one extension module, semops_system._native. It keeps the
# names the 0.29.0.dev1 bridge used (semops_system.holos, .shacl, .tarka), so code written
# against the bridge keeps working. The version is the workspace's, read from Cargo.
dynamic = ["version"]
description = "SemOps System: an RDF 1.2 store with SPARQL 1.2 and GeoSPARQL, the SHACL engine, tarka mapping and the ontology quality checks, in one native package"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Peter Winstanley" }]
keywords = ["rdf", "rdf-1.2", "sparql", "shacl", "geosparql", "triplestore", "tarql", "ottr", "ontology", "semantic-web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Nothing else is required. tarka converts Polars data frames through the polars package,
# which loads only when a data frame is passed, so it is an extra: about 55 MB that
# everything else in the package does without.
dependencies = []

[project.optional-dependencies]
polars = ["polars>=1.30"]
test = ["pytest>=8", "polars>=1.30"]

# The semops command, the same as the binary (see semops_system/__main__.py).
[project.scripts]
semops = "semops_system.__main__:main"

[project.urls]
Homepage = "https://github.com/pwin/SemopsSystem"
Repository = "https://github.com/pwin/SemopsSystem"
Issues = "https://github.com/pwin/SemopsSystem/issues"

[tool.maturin]
manifest-path = "../../crates/semops-python/Cargo.toml"
python-source = "src"
module-name = "semops_system._native"
features = ["pyo3/extension-module"]
