[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "semops-system"
# A bridge release, ahead of the workspace's own native wheel (roadmap phase 3). It installs
# the engine releases that belong together, as versions.toml lists them, and presents them as
# one package: `semops_system.holos`, `.shacl` and `.tarka`. The native wheel will keep those
# names, so code written against this release keeps working when it replaces it.
version = "0.29.0.dev1"
description = "SemOps System: RDF 1.2, SPARQL 1.2, SHACL and GeoSPARQL (HOLOS), the SHACL engine and tarka, as one install"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Peter Winstanley" }]
keywords = ["rdf", "rdf-1.2", "sparql", "shacl", "geosparql", "triplestore", "tarql", "ottr", "semantic-web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Exact pins: the point of this package is that these three are the ones that agree.
# Kept equal to versions.toml by tests/test_versions.py.
dependencies = [
    "holosdb==0.27.0",
    "shacl==0.3.9",
    "tarka-rdf==0.3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/pwin/SemopsSystem"
Repository = "https://github.com/pwin/SemopsSystem"
Issues = "https://github.com/pwin/SemopsSystem/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/semops_system"]
